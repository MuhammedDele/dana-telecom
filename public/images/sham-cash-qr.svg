<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="مكان رمز QR الخاص بحساب شام كاش">
  <rect width="320" height="320" rx="24" fill="#ffffff"/>
  <rect x="8" y="8" width="304" height="304" rx="18" fill="none" stroke="#282369" stroke-width="3" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- علامات زوايا QR -->
  <g fill="none" stroke="#282369" stroke-width="9" opacity="0.85">
    <rect x="42" y="42" width="58" height="58" rx="10"/>
    <rect x="220" y="42" width="58" height="58" rx="10"/>
    <rect x="42" y="220" width="58" height="58" rx="10"/>
  </g>
  <g fill="#282369" opacity="0.85">
    <rect x="61" y="61" width="20" height="20" rx="4"/>
    <rect x="239" y="61" width="20" height="20" rx="4"/>
    <rect x="61" y="239" width="20" height="20" rx="4"/>
  </g>

  <!-- وحدات زخرفية -->
  <g fill="#282369" opacity="0.16">
    <rect x="130" y="46" width="14" height="14" rx="3"/>
    <rect x="152" y="68" width="14" height="14" rx="3"/>
    <rect x="174" y="46" width="14" height="14" rx="3"/>
    <rect x="46" y="130" width="14" height="14" rx="3"/>
    <rect x="68" y="152" width="14" height="14" rx="3"/>
    <rect x="46" y="174" width="14" height="14" rx="3"/>
    <rect x="238" y="130" width="14" height="14" rx="3"/>
    <rect x="260" y="152" width="14" height="14" rx="3"/>
    <rect x="238" y="174" width="14" height="14" rx="3"/>
    <rect x="130" y="238" width="14" height="14" rx="3"/>
    <rect x="152" y="260" width="14" height="14" rx="3"/>
    <rect x="174" y="238" width="14" height="14" rx="3"/>
  </g>

  <!-- شارة الوسط -->
  <rect x="106" y="128" width="108" height="64" rx="14" fill="#FFF200"/>
  <text x="160" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="17" font-weight="bold" fill="#282369">ضع رمز</text>
  <text x="160" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="17" font-weight="bold" fill="#282369">QR هنا</text>

  <text x="160" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#5c5c72">صورة توضيحية — استبدلها برمز حسابك</text>
</svg>
